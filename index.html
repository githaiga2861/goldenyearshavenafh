<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Years Haven Adult Family Home — Coming Soon</title>
<meta name="description" content="Golden Years Haven Adult Family Home — a warm, caring place to call home. Our website is coming soon.">
<meta property="og:title" content="Golden Years Haven Adult Family Home">
<meta property="og:description" content="A warm, caring place to call home. Our website is coming soon.">
<meta property="og:image" content="https://goldenyearshavenadultfamilyhome.com/assets/logo.png">
<meta property="og:url" content="https://goldenyearshavenadultfamilyhome.com/">
<meta name="theme-color" content="#fdfaf4">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #fdfaf4;
    --champagne: #f7efe0;
    --gold: #c9a24a;
    --gold-soft: #e3c98c;
    --ink: #5a4a36;
    --ink-soft: #5e4c37;
    --gold-text: #9c7526;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif; font-weight: 300;
    color: var(--ink);
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, #fffdf8 0%, rgba(255,253,248,0) 70%),
      linear-gradient(180deg, var(--ivory) 0%, var(--champagne) 100%);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Ambient background ---- */
  .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .halo {
    position: absolute; left: 50%; top: 36%;
    width: 80vmin; height: 80vmin; transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(233,203,138,.28) 0%, rgba(233,203,138,0) 65%);
    opacity: 0; animation: fade 3s ease .2s forwards, breathe 10s ease-in-out 3s infinite;
  }
  .ring {
    position: absolute; left: 50%; top: 36%;
    width: 46vmin; height: 46vmin;
    border-radius: 50%; border: 1px solid rgba(201,162,74,.16);
    transform: translate(-50%, -50%) scale(.6); opacity: 0;
    animation: ripple 14s cubic-bezier(.25,.6,.3,1) infinite;
  }
  .ring.r1 { animation-delay: 1.8s; }
  .ring.r2 { animation-delay: 6.5s; }
  .ring.r3 { animation-delay: 11.2s; }
  .mote {
    position: absolute; bottom: -8px; border-radius: 50%;
    background: radial-gradient(circle, rgba(214,178,98,.75), rgba(214,178,98,0) 70%);
    opacity: 0; animation: float linear infinite;
  }

  /* ---- Content ---- */
  main {
    position: relative; z-index: 1; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 8vh 24px 10vh;
  }
  .logo {
    position: relative; width: clamp(150px, 22vmin, 210px); aspect-ratio: 447 / 560;
    opacity: 0; filter: blur(8px); transform: scale(.96);
    animation: arrive 2.4s cubic-bezier(.2,.7,.2,1) .3s forwards;
  }
  .logo img { width: 100%; height: 100%; display: block; }
  .logo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,250,230,.95) 50%, transparent 65%);
    background-size: 250% 100%; background-position: 130% 0;
    -webkit-mask: url(assets/logo.png) center / contain no-repeat;
            mask: url(assets/logo.png) center / contain no-repeat;
    mix-blend-mode: screen;
    animation: shimmer 7s ease-in-out 2.6s infinite;
  }

  h1 {
    margin-top: 34px;
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300;
    font-size: clamp(2.3rem, 6.4vw, 4.2rem); line-height: 1.08; letter-spacing: .01em;
    color: var(--ink);
  }
  h1 .w { display: inline-block; opacity: 0; transform: translateY(12px); filter: blur(4px);
          animation: word 1.6s cubic-bezier(.2,.7,.2,1) forwards; }
  h1 .w:nth-child(1) { animation-delay: 1.5s; }
  h1 .w:nth-child(2) { animation-delay: 1.7s; }
  h1 .w:nth-child(3) { animation-delay: 1.9s; }
  h1 em { font-style: italic; color: var(--gold); }

  .sub {
    margin-top: 12px; font-size: clamp(.72rem, 1.7vw, .86rem);
    letter-spacing: .42em; text-transform: uppercase; color: var(--ink-soft);
    padding-left: .42em;
    opacity: 0; animation: rise 1.6s ease 2.4s forwards;
  }
  .rule {
    margin: 30px auto 26px; height: 1px; width: 0;
    background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
    animation: draw 2s cubic-bezier(.2,.7,.2,1) 2.8s forwards;
  }
  .tagline {
    max-width: 30rem;
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 400;
    font-size: clamp(1.15rem, 2.6vw, 1.4rem); line-height: 1.6; color: var(--ink-soft);
    opacity: 0; animation: rise 1.6s ease 3.2s forwards;
  }
  .soon {
    margin-top: 34px; display: flex; align-items: center; gap: 18px;
    font-size: .78rem; letter-spacing: .5em; text-transform: uppercase; color: var(--gold-text);
    padding-left: .5em;
    opacity: 0; animation: rise 1.6s ease 3.7s forwards;
  }
  .soon::before, .soon::after { content: ""; width: 34px; height: 1px; background: var(--gold-soft); }
  .soon span { animation: glow 4s ease-in-out 5.3s infinite; }

  footer {
    position: relative; z-index: 1; text-align: center; padding: 0 16px 26px;
    font-size: .74rem; letter-spacing: .14em; color: var(--ink-soft);
    opacity: 0; animation: fade 2s ease 4.2s forwards;
  }

  /* ---- Keyframes ---- */
  @keyframes fade { to { opacity: 1; } }
  @keyframes arrive { to { opacity: 1; filter: blur(0); transform: scale(1); } }
  @keyframes word { to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { width: min(200px, 46vw); } }
  @keyframes shimmer { 0%, 55% { background-position: 130% 0; } 85%, 100% { background-position: -30% 0; } }
  @keyframes breathe { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 50% { transform: translate(-50%,-50%) scale(1.06); opacity: .75; } }
  @keyframes ripple {
    0% { transform: translate(-50%,-50%) scale(.6); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(2.6); opacity: 0; }
  }
  @keyframes float {
    0% { transform: translate(0,0); opacity: 0; }
    20% { opacity: .9; }
    100% { transform: translate(var(--dx), -90vh); opacity: 0; }
  }
  @keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    .ring, .mote, .logo::after { display: none; }
  }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="halo"></div>
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div id="motes"></div>
  </div>

  <main>
    <div class="logo"><img src="assets/logo.png" alt="Golden Years logo" width="447" height="560"></div>
    <h1><span class="w">Golden</span> <span class="w">Years</span> <span class="w"><em>Haven</em></span></h1>
    <p class="sub">Adult Family Home</p>
    <div class="rule"></div>
    <p class="tagline">A warm, caring place to call home, where every resident is cherished like family.</p>
    <p class="soon"><span>Coming Soon</span></p>
  </main>

  <footer>&copy; <span id="yr"></span> Golden Years Haven Adult Family Home</footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var box = document.getElementById('motes');
      for (var i = 0; i < 16; i++) {
        var m = document.createElement('span'), s = 4 + Math.random() * 6;
        m.className = 'mote';
        m.style.width = m.style.height = s + 'px';
        m.style.left = Math.random() * 100 + 'vw';
        m.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
        m.style.animationDuration = 16 + Math.random() * 14 + 's';
        m.style.animationDelay = 2 + Math.random() * 14 + 's';
        box.appendChild(m);
      }
    }
  </script>
</body>
</html>
