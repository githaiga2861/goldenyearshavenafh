<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Years Haven Adult Family Home — Coming Soon</title>
<meta name="description" content="Golden Years Haven Adult Family Home — a warm, caring place to call home. Our website is coming soon.">
<meta property="og:title" content="Golden Years Haven Adult Family Home">
<meta property="og:description" content="A warm, caring place to call home. Our website is coming soon.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://goldenyearshavenadultfamilyhome.com/">
<meta name="theme-color" content="#f6ecdc">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='16' fill='%23d9a441'/%3E%3Cpath d='M4 48h56v12H4z' fill='%237a5c3e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fbf5ea;
    --sand: #f3e4cb;
    --gold: #d9a441;
    --gold-deep: #b9842a;
    --brown: #4a3726;
    --brown-soft: #7a5c3e;
    --sage: #9bae8f;
    --sage-deep: #7d9271;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Nunito Sans", system-ui, sans-serif;
    color: var(--brown);
    background: linear-gradient(180deg, #fdf3e3 0%, #f8e2c2 55%, #f3d4a8 100%);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Sky & sunrise scene ---------- */
  .scene {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .glow {
    position: absolute; left: 50%; bottom: 18vh;
    width: 120vmax; height: 120vmax; transform: translate(-50%, 50%);
    background: radial-gradient(circle, rgba(255,214,140,.55) 0%, rgba(255,214,140,.18) 30%, rgba(255,214,140,0) 55%);
    animation: glow 4s ease-out both, breathe 9s ease-in-out 4s infinite;
  }
  .sun {
    position: absolute; left: 50%; bottom: 18vh;
    width: 22vmin; height: 22vmin; min-width: 140px; min-height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #ffe2a3 0%, #f6c05c 55%, #e3a23e 100%);
    box-shadow: 0 0 80px 20px rgba(246,192,92,.35);
    transform: translate(-50%, 60%);
    animation: rise 4.2s cubic-bezier(.22,.8,.3,1) both;
  }
  .rays {
    position: absolute; left: 50%; bottom: 18vh;
    width: 60vmin; height: 60vmin; min-width: 380px; min-height: 380px;
    transform: translate(-50%, 50%);
    background: repeating-conic-gradient(from 0deg, rgba(255,226,163,.22) 0deg 6deg, rgba(255,226,163,0) 6deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%);
            mask: radial-gradient(circle, #000 18%, transparent 68%);
    opacity: 0;
    animation: fadeIn 2s ease 3s forwards, spin 120s linear 3s infinite;
  }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 30vh; min-height: 180px; }
  .hills path { transform-origin: bottom; animation: hill 2.6s cubic-bezier(.22,.8,.3,1) both; }
  .hills .h2 { animation-delay: .2s; }
  .hills .h3 { animation-delay: .4s; }

  .bird { position: absolute; width: 26px; height: 10px; opacity: 0; animation: fly 22s linear infinite; }
  .bird svg { width: 100%; height: 100%; overflow: visible; }
  .bird path { animation: flap 1.1s ease-in-out infinite; transform-origin: center; }
  .bird:nth-child(1) { top: 22vh; animation-delay: 5s; }
  .bird:nth-child(2) { top: 26vh; animation-delay: 6.2s; transform: scale(.75); }
  .bird:nth-child(3) { top: 18vh; animation-delay: 13s; transform: scale(.6); }

  .mote {
    position: absolute; bottom: -10px; width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255, 220, 150, .85); filter: blur(.5px);
    animation: drift linear infinite; opacity: 0;
  }

  /* ---------- Content ---------- */
  main {
    position: relative; z-index: 1; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    text-align: center; padding: 10vh 24px 36vh;
  }
  .emblem {
    width: 64px; height: 64px; margin-bottom: 22px;
    opacity: 0; animation: up 1.2s ease 1.2s forwards;
  }
  .eyebrow {
    font-size: .8rem; letter-spacing: .32em; text-transform: uppercase; color: var(--brown-soft);
    opacity: 0; animation: up 1.2s ease 1.5s forwards;
  }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 4.8rem); line-height: 1.04; margin: 14px 0 6px;
    color: var(--brown);
  }
  h1 .line { display: block; overflow: hidden; }
  h1 .line span { display: inline-block; transform: translateY(110%); animation: reveal 1.3s cubic-bezier(.22,.8,.3,1) forwards; }
  h1 .line:nth-child(1) span { animation-delay: 1.7s; }
  h1 .line:nth-child(2) span { animation-delay: 1.95s; }
  .sub {
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500;
    font-size: clamp(1.25rem, 3.2vw, 1.8rem); color: var(--gold-deep);
    opacity: 0; animation: up 1.2s ease 2.4s forwards;
  }
  .divider {
    width: 0; height: 1px; margin: 26px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: grow 1.6s ease 2.8s forwards;
  }
  .tagline {
    max-width: 34rem; font-size: clamp(1rem, 2.3vw, 1.12rem); line-height: 1.7; color: var(--brown-soft);
    opacity: 0; animation: up 1.2s ease 3.1s forwards;
  }
  .soon {
    margin-top: 30px; display: inline-flex; align-items: center; gap: 12px;
    padding: 12px 26px; border-radius: 999px;
    background: rgba(255,255,255,.55); border: 1px solid rgba(217,164,65,.45);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-weight: 600; letter-spacing: .2em; text-transform: uppercase; font-size: .82rem; color: var(--brown);
    opacity: 0; animation: up 1.2s ease 3.5s forwards;
  }
  .heart { width: 16px; height: 16px; color: #c8694f; animation: beat 1.8s ease-in-out 4.5s infinite; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1; text-align: center; padding: 18px 16px 22px;
    font-size: .8rem; color: rgba(255,255,255,.92); letter-spacing: .04em;
    opacity: 0; animation: fadeIn 1.4s ease 3.9s forwards;
  }

  /* ---------- Keyframes ---------- */
  @keyframes rise { from { transform: translate(-50%, 80%); } to { transform: translate(-50%, 20%); } }
  @keyframes glow { from { opacity: 0; } to { opacity: 1; } }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .78; } }
  @keyframes spin { to { transform: translate(-50%, 50%) rotate(360deg); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes hill { from { transform: translateY(40%); } to { transform: translateY(0); } }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes reveal { to { transform: translateY(0); } }
  @keyframes grow { to { width: min(220px, 50vw); } }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.2); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  @keyframes fly {
    0% { left: -40px; opacity: 0; } 5% { opacity: .55; } 95% { opacity: .55; } 100% { left: 105vw; opacity: 0; }
  }
  @keyframes flap { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(-.4); } }
  @keyframes drift {
    0% { transform: translate(0,0); opacity: 0; }
    15% { opacity: .9; }
    100% { transform: translate(var(--dx, 30px), -75vh); opacity: 0; }
  }

  @media (max-width: 600px) {
    main { padding-top: 8vh; padding-bottom: 30vh; }
    .soon { letter-spacing: .14em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    .sun { transform: translate(-50%, 20%); }
    .mote, .bird { display: none; }
  }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="glow"></div>
    <div class="rays"></div>
    <div class="sun"></div>
    <div class="birds">
      <div class="bird"><svg viewBox="0 0 26 10"><path d="M0 6 Q6 0 13 6 Q20 0 26 6" fill="none" stroke="#7a5c3e" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      <div class="bird"><svg viewBox="0 0 26 10"><path d="M0 6 Q6 0 13 6 Q20 0 26 6" fill="none" stroke="#7a5c3e" stroke-width="1.6" stroke-linecap="round"/></svg></div>
      <div class="bird"><svg viewBox="0 0 26 10"><path d="M0 6 Q6 0 13 6 Q20 0 26 6" fill="none" stroke="#7a5c3e" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    </div>
    <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path class="h1" fill="#c9cfa6" d="M0 170 C 240 90, 480 120, 720 150 S 1200 90, 1440 140 L1440 320 L0 320Z"/>
      <path class="h2" fill="#9bae8f" d="M0 215 C 300 160, 560 230, 820 200 S 1250 160, 1440 205 L1440 320 L0 320Z"/>
      <path class="h3" fill="#7d9271" d="M0 265 C 260 230, 520 280, 780 255 S 1220 235, 1440 260 L1440 320 L0 320Z"/>
    </svg>
    <div id="motes"></div>
  </div>

  <main>
    <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,.55)" stroke="#d9a441" stroke-width="1.5"/>
      <path d="M17 33 L32 20 L47 33" fill="none" stroke="#7a5c3e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21 31 V45 H43 V31" fill="none" stroke="#7a5c3e" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M32 42 c-4-3-6-5-6-7.5 a3 3 0 0 1 6-1 a3 3 0 0 1 6 1 c0 2.5-2 4.5-6 7.5z" fill="#d9a441"/>
    </svg>
    <p class="eyebrow">Welcome to</p>
    <h1>
      <span class="line"><span>Golden Years Haven</span></span>
    </h1>
    <p class="sub">Adult Family Home</p>
    <div class="divider"></div>
    <p class="tagline">A warm, caring place to call home, where every resident is treated like family. Our new website is on its way.</p>
    <div class="soon">
      <svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.3 4.5 6 4.5c2.2 0 3.6 1.2 4.3 2.4h1.4c.7-1.2 2.1-2.4 4.3-2.4 3.7 0 5.6 3.9 4 7.2C19.5 16.4 12 21 12 21z"/></svg>
      Coming Soon
    </div>
  </main>

  <footer>&copy; <span id="yr"></span> Golden Years Haven Adult Family Home</footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var box = document.getElementById('motes');
      for (var i = 0; i < 18; i++) {
        var m = document.createElement('span');
        m.className = 'mote';
        var s = 3 + Math.random() * 5;
        m.style.width = m.style.height = s + 'px';
        m.style.left = (Math.random() * 100) + 'vw';
        m.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
        m.style.animationDuration = (12 + Math.random() * 14) + 's';
        m.style.animationDelay = (3 + Math.random() * 12) + 's';
        box.appendChild(m);
      }
    }
  </script>
</body>
</html>
